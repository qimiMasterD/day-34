<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Comments</title>

        <!-- Font awersome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
            integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />

        <!-- CSS -->
        <link rel="stylesheet" href="./assets/css/reset.css" />
        <link rel="stylesheet" href="./assets/css/comments.css" />
    </head>
    <body>
        <div id="root">
            <h1 class="comments-heading">Comments</h1>
            <div class="comments-wrapper">
                <form class="comment-form">
                    <div class="comment-header">New comment</div>
                    <div class="comment-user-details">
                        <input
                            type="text"
                            class="comment-input-text"
                            name="authorName"
                            id="authorName"
                            placeholder="Enter your name..."
                        />
                        <input
                            type="email"
                            class="comment-input-text"
                            name="authorEmail"
                            id="authorEmail"
                            placeholder="Enter your email..."
                        />
                    </div>
                    <textarea
                        class="comment-textarea"
                        name="commentContent"
                        id="commentContent"
                        placeholder="Write your comments here..."
                    ></textarea>
                    <button class="comment-submit-button" type="submit">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
                <div class="comment-list">
                    <div class="comment-item">
                        <div class="comment-avatar"><img src="" alt="" /></div>
                        <div class="comment-content">
                            <div class="comment-metadata">
                                <div class="comment-author">
                                    id labore ex et quam laborum
                                </div>
                                <div class="comment-email">
                                    Eliseo@gardner.biz
                                </div>
                                <div class="comment-timestamp">2 hours ago</div>
                            </div>
                            <div class="comment-text">
                                laudantium enim quasi est quidem magnam
                                voluptate ipsam eos\ntempora quo
                                necessitatibus\ndolor quam autem
                                quasi\nreiciendis et nam sapiente accusantium
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script
            crossorigin
            src="https://unpkg.com/react@18/umd/react.production.min.js"
        ></script>
        <script
            crossorigin
            src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
        ></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <script src="./assets/js/comments.js" type="text/babel"></script>
    </body>
</html>
